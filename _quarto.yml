project:
  type: website
  output-dir: docs
  # Solution files stay OUT of the public render by default — reveal one
  # only after that week's session is done, by commenting out its line
  # here (so it renders again).
  render:
    - "*.qmd"
    - "podstawy_programowania/**/*.qmd"
    - "!podstawy_programowania/cwiczenia_chip8/01_szkielet_vm_rozwiazanie.qmd"
    - "!podstawy_programowania/cwiczenia_chip8/02_arytmetyka_skoki_rozwiazanie.qmd"
    - "!podstawy_programowania/cwiczenia_chip8/03_wyswietlacz_rozwiazanie.qmd"
    - "!podstawy_programowania/cwiczenia_chip8/04_timery_klawiatura_rozwiazanie.qmd"

website:
  title: Wprowadzenie do Programowania - Laboratorium
  description: "Wprowadzenie do programowania - laboratorium dla studentów WAT w Warszawie"
  site-url: https://sebkaz-teaching.github.io/wdplab2026
  sidebar:
    style: "docked"
    contents:
      - index.qmd
  page-footer: "Copyright 2026, Sebastian Zając"
format:
  html:
    page-layout: article
    css: style.css
    theme: cosmo
    toc: true
    toc-depth: 2
    toc-title: "**Sections**"
    self-contained-math: true
    code-overflow: wrap
    highlight-style: dark
    code-block-background: true
    link-external-newwindow: true
