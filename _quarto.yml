project:
  type: website
  output-dir: docs
  render:
    - "index.qmd"
    - "scenariusze.qmd"
    - "podstawy_programowania/visual-studio-community.qmd"
    - "laboratoria/*.qmd"
  resources:
    - "assets/cpp/**"
  # Historical C/CHIP-8 render rules, retained for reference only.
  # # Solution files stay OUT of the public render by default — reveal one
  # # only after that week's session is done, by commenting out its line
  # # here (so it renders again).
  # render:
  # - "*.qmd"
  # - "podstawy_programowania/**/*.qmd"
  # - "!podstawy_programowania/cwiczenia_chip8/01_szkielet_vm_rozwiazanie.qmd"
  # - "!podstawy_programowania/cwiczenia_chip8/02_arytmetyka_skoki_rozwiazanie.qmd"
  # - "!podstawy_programowania/cwiczenia_chip8/03_wyswietlacz_rozwiazanie.qmd"
  # - "!podstawy_programowania/cwiczenia_chip8/04_timery_klawiatura_rozwiazanie.qmd"

website:
  title: "Wprowadzenie do programowania — C++"
  description: "Siedem instrukcji laboratoryjnych: od programu konsolowego do własnych klas."
  site-url: https://sebkaz-teaching.github.io/wdplab2026
  sidebar:
    style: docked
    contents:
      - index.qmd
      - podstawy_programowania/visual-studio-community.qmd
      - scenariusze.qmd
      - section: "Instrukcje laboratoryjne"
        contents:
          - laboratoria/01_projekt.qmd
          - laboratoria/02_warunki.qmd
          - laboratoria/03_petle_tablice.qmd
          - laboratoria/04_funkcje.qmd
          - laboratoria/05_wektor.qmd
          - laboratoria/06_klasa.qmd
          - laboratoria/07_rejestr.qmd
  page-footer: "Copyright 2026, Sebastian Zając"
format:
  html:
    lang: pl
    page-layout: article
    css: style.css
    theme: cosmo
    toc: true
    toc-depth: 2
    toc-title: "Na tej stronie"
    code-overflow: wrap
    highlight-style: github
    code-block-background: true
    link-external-newwindow: true
