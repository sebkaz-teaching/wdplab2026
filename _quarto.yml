          - podstawy_programowania/sesje/10_wskazniki_podstawy.qmd
          - podstawy_programowania/sesje/11_wskazniki_do_struktur.qmd
          - podstawy_programowania/sesje/12_pamiec_dynamiczna.qmd
          - podstawy_programowania/sesje/13_licznik_instrukcji.qmd
